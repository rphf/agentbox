<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentbox panel</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  :root { color-scheme: light dark; --bg:#0b0d12; --card:#12161e; --line:#222835; --fg:#e6e8ee; --dim:#8891a4;
          --link:#8ab4ff; --up:#3fb950; --down:#596273; --busy:#d29922; --btn:#1c222d; --btnh:#28303d;
          --accent:#2f6feb; --accenth:#3b7bfa; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --card:#fff; --line:#e4e7ec; --fg:#1a1d24; --dim:#66707f; --down:#b6bcc8;
            --link:#1a56db; --btn:#f0f2f5; --btnh:#e4e8ee; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:13.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 1.6rem 1rem 3rem; }

  header { display:flex; align-items:center; gap:.7rem; margin-bottom:1.1rem; }
  header img { width:28px; height:28px; border-radius:7px; flex:none; }
  .title { display:flex; align-items:baseline; gap:.6rem; min-width:0; flex-wrap:wrap; }
  h1 { font-size:1.05rem; margin:0; font-weight:650; letter-spacing:-.01em; white-space:nowrap; }
  .host { color:var(--dim); font-size:.85rem; font-family:var(--mono); }
  .live { margin-left:auto; color:var(--dim); font-size:.75rem; display:flex; align-items:center; gap:.4rem; white-space:nowrap; }
  .live::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--up); animation:pulse 2.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.85rem 1rem; margin-bottom:.7rem; }
  .head { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; min-height:2rem; }
  .head h2 { font-size:.92rem; margin:0; font-weight:600; display:flex; align-items:center; gap:.55rem; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--down); flex:none; }
  .dot.up { background:var(--up); } .dot.busy { background:var(--busy); }
  .state { color:var(--dim); font-size:.82rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .state a { color:var(--link); text-decoration:none; font-family:var(--mono); font-size:.8rem; }
  .state a:hover { text-decoration:underline; }
  .actions { margin-left:auto; display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
  .row2 { display:flex; gap:.4rem; align-items:center; margin-top:.6rem; }

  button, a.btn { font:inherit; font-size:.85rem; border:1px solid var(--line); background:var(--btn); color:var(--fg);
                  cursor:pointer; padding:.36rem .7rem; border-radius:8px; text-decoration:none; display:inline-block;
                  white-space:nowrap; line-height:1.3; }
  button:hover, a.btn:hover { background:var(--btnh); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .primary { border-color:transparent !important; background:var(--accent) !important; color:#fff !important; }
  .primary:hover { background:var(--accenth) !important; }
  a.btn.disabled { pointer-events:none; opacity:.4; }
  input.args { font:inherit; font-family:var(--mono); font-size:.8rem; border:1px solid var(--line); background:var(--bg);
               color:var(--fg); border-radius:8px; padding:.36rem .6rem; flex:1; min-width:10rem; }
  input.args:focus { outline:none; border-color:var(--accent); }

  .files { list-style:none; margin:.6rem 0 0; padding:0; border-top:1px solid var(--line); }
  .files li { display:flex; align-items:baseline; gap:.8rem; padding:.38rem 0; border-bottom:1px solid var(--line); font-size:.83rem; }
  .files li:last-child { border-bottom:0; }
  .files a { color:var(--fg); text-decoration:none; font-family:var(--mono); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .files a:hover { color:var(--link); }
  .files .meta { color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; font-size:.78rem; }
  .files .meta.size { min-width:4.5rem; text-align:right; }
  .files .meta.age { min-width:5rem; text-align:right; }
  .empty { color:var(--dim); font-size:.83rem; margin:.6rem 0 0; }
  .more { display:block; margin-top:.5rem; font-size:.8rem; color:var(--link); text-decoration:none; }
  .more:hover { text-decoration:underline; }
  code.cmd { font-family:var(--mono); font-size:.78rem; color:var(--dim); background:var(--btn); border:1px solid var(--line);
             border-radius:6px; padding:.15rem .45rem; cursor:pointer; white-space:nowrap; }
  code.cmd:hover { color:var(--fg); }

  #toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:var(--card);
           border:1px solid var(--line); padding:.45rem .85rem; border-radius:8px; font-size:.82rem;
           box-shadow:0 6px 24px rgba(0,0,0,.3); opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/logo.svg" alt="">
    <div class="title"><h1 id="agent">agentbox</h1><span class="host" id="host"></span></div>
    <span class="live">live</span>
  </header>

  <section class="card">
    <div class="head">
      <h2><span class="dot" id="app-dot"></span>App</h2>
      <span class="state" id="app-state">checking…</span>
      <div class="actions" id="app-actions"></div>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <h2><span class="dot" id="revue-dot"></span>Code review</h2>
      <span class="state" id="revue-state">checking…</span>
      <div class="actions" id="revue-actions"></div>
    </div>
    <div class="row2" id="revue-row2" hidden>
      <input class="args" id="revue-args" placeholder="git diff arguments, e.g. main...HEAD or -- app/" aria-label="git diff arguments">
      <button id="revue-open-args">Open that diff</button>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <h2><span class="dot up"></span>Outbox</h2>
      <span class="state" id="out-state"></span>
      <div class="actions"><code class="cmd" id="out-cmd" title="click to copy">agentbox get N</code></div>
    </div>
    <ul class="files" id="out-files"></ul>
    <p class="empty" id="out-empty" hidden>Nothing handed back yet. Files the agent writes to ~/out show up here.</p>
    <a class="more" id="out-more" href="/_out/" hidden></a>
  </section>
</div>
<div id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let pendingUntil = 0; // while starting the app, keep the dot amber and poll faster
  let revueBusy = false; // an open or stop in flight: leave the revue controls alone until it lands
  const MAX_FILES = 8;

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  async function post(path, body) {
    try {
      const r = await fetch(path, {
        method: "POST",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      return await r.json();
    } catch (e) { return { ok: false, error: String(e) }; }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function size(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  function age(ts) {
    const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    if (s < 7 * 86400) return Math.floor(s / 86400) + " d ago";
    return new Date(ts * 1000).toLocaleDateString();
  }

  // Open the tab on the click itself, before any await, so the popup blocker sees a user gesture; the
  // login link arrives a moment later and the tab follows it.
  async function openRevue(args) {
    const tab = window.open("", "_blank");
    revueBusy = true;
    const r = await post("/api/revue/open", { args });
    revueBusy = false;
    if (r.ok && r.url) { if (tab) tab.location = r.url; else window.open(r.url, "_blank", "noopener"); }
    else { if (tab) tab.close(); toast(r.error || "revue open failed"); }
    refresh();
  }

  function render(s) {
    $("agent").textContent = s.agent || "agentbox";
    $("host").textContent = s.host || "";
    $("out-cmd").textContent = "agentbox get " + (s.agent_num || "N");

    // App
    const a = s.app || {};
    const starting = Date.now() < pendingUntil && !a.up;
    $("app-dot").className = "dot" + (a.up ? " up" : starting ? " busy" : "");
    if (!a.available) {
      $("app-state").textContent = "no app command in this box";
      $("app-actions").innerHTML = "";
    } else {
      $("app-state").innerHTML = starting ? "starting…"
        : a.up ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.url) + "</a>"
        : "stopped";
      $("app-actions").innerHTML =
        '<a class="btn primary' + (a.up ? "" : " disabled") + '" href="' + esc(a.url || "#") + '" target="_blank" rel="noopener">Open</a>'
        + '<button id="app-start"' + (a.up || starting ? " disabled" : "") + ">Start</button>"
        + '<button id="app-stop"' + (a.up ? "" : " disabled") + ">Stop</button>";
      $("app-start").onclick = async () => {
        $("app-start").disabled = true; toast("starting the app…"); pendingUntil = Date.now() + 90000;
        await post("/api/app/start"); refresh();
      };
      $("app-stop").onclick = async () => {
        $("app-stop").disabled = true; toast("stopping the app…"); pendingUntil = 0;
        const r = await post("/api/app/stop"); toast(r.ok ? "app stopped" : "stop failed"); refresh();
      };
    }

    // Code review: the reviewer's page follows the box's working tree live. Opening mints a login link
    // (which starts the server when it is down) and lands on the diff.
    const rv = s.revue || {};
    $("revue-dot").className = "dot" + (rv.up ? " up" : "");
    if (!rv.available) {
      $("revue-state").textContent = "no review port on this box";
      $("revue-actions").innerHTML = "";
      $("revue-row2").hidden = true;
    } else if (!revueBusy) {
      $("revue-state").innerHTML = rv.up
        ? '<a href="' + esc(rv.url) + '" target="_blank" rel="noopener">' + esc(rv.url.replace(/^https?:\/\//, "")) + "</a>"
          + (rv.version ? " · revue " + esc(rv.version) : "")
        : "stopped" + (rv.version ? " · revue " + esc(rv.version) : "");
      $("revue-actions").innerHTML =
        '<button class="primary" id="revue-open">Open working tree</button>'
        + '<button id="revue-stop"' + (rv.up ? "" : " disabled") + ">Stop</button>";
      $("revue-row2").hidden = false;
      $("revue-open").onclick = () => openRevue([]);
      const argsBox = $("revue-args");
      const openArgs = () => {
        const args = argsBox.value.trim().split(/\s+/).filter(Boolean);
        if (args.length) openRevue(args);
      };
      $("revue-open-args").onclick = openArgs;
      argsBox.onkeydown = (e) => { if (e.key === "Enter") openArgs(); };
      $("revue-stop").onclick = async () => {
        revueBusy = true; $("revue-stop").disabled = true; toast("stopping revue…");
        const r = await post("/api/revue/stop");
        revueBusy = false;
        toast(r.ok ? "revue stopped" : "revue did not stop"); refresh();
      };
    }

    // Outbox: newest first, the rest one click away.
    const o = s.out || {};
    const files = o.files || [];
    const count = o.count ?? files.length;
    $("out-state").textContent = count === 0 ? "empty" : count + " file" + (count === 1 ? "" : "s");
    $("out-files").innerHTML = files.slice(0, MAX_FILES).map((f) =>
      '<li><a href="/' + esc(f.name).replace(/%/g, "%25") + '" target="_blank" rel="noopener">' + esc(f.name) + "</a>"
      + '<span class="meta size">' + size(f.size) + "</span>"
      + '<span class="meta age">' + age(f.mtime) + "</span></li>").join("");
    $("out-empty").hidden = count !== 0;
    const more = $("out-more");
    more.hidden = count <= MAX_FILES;
    more.textContent = "All " + count + " files";
  }

  $("out-cmd").onclick = async () => {
    try { await navigator.clipboard.writeText($("out-cmd").textContent); toast("copied"); }
    catch (e) { toast($("out-cmd").textContent); }
  };

  async function refresh() {
    try {
      const r = await fetch("/api/status", { cache: "no-store" });
      render(await r.json());
    } catch (e) { /* keep last render on a transient failure */ }
  }

  refresh();
  setInterval(() => refresh(), 3000);
</script>
</body>
</html>
